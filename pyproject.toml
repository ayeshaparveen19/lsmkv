[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lsmkv"
version = "0.1.0"
description = "A small, crash-safe, embedded LSM-tree key-value store in pure Python"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
lsmkv = "lsmkv.cli:main"

[tool.setuptools]
packages = ["lsmkv"]
